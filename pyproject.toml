[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudlens"
version = "0.1.0"
description = "Integration-first fraud intelligence platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.14.0",
  "fastapi==0.115.6",
  "cryptography==44.0.0",
  "httpx==0.28.1",
  "joblib==1.6.0",
  "psycopg[binary]==3.2.3",
  "pydantic-settings==2.7.1",
  "scikit-learn==1.6.1",
  "sqlalchemy==2.0.36",
  "structlog==24.4.0",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.6",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "sdk/python/tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
mypy_path = "backend"
exclude = ["backend/alembic"]
