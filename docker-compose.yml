services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraudlens}
      POSTGRES_USER: ${POSTGRES_USER:-fraudlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudlens_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fraudlens}:${POSTGRES_PASSWORD:-fraudlens_dev}@postgres:5432/${POSTGRES_DB:-fraudlens}
      API_KEY_HASH_PEPPER: ${API_KEY_HASH_PEPPER:-development-only-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RISK_MODE_DEFAULT: ${RISK_MODE_DEFAULT:-shadow}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
