[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudlens-sdk"
version = "0.1.0"
description = "Typed Python SDK for FraudLens"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx==0.28.1", "pydantic==2.12.5"]

[tool.setuptools.packages.find]
where = ["."]
