name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: fraudlens
          POSTGRES_USER: fraudlens
          POSTGRES_PASSWORD: fraudlens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraudlens -d fraudlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://fraudlens:fraudlens_ci@localhost:5432/fraudlens
      API_KEY_HASH_PEPPER: test-pepper-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install SDK dependencies
        run: python -m pip install -e sdk/python
      - name: Check formatting
        run: python -m ruff format --check backend data scripts sdk/python examples/merchant_simulator
      - name: Lint
        run: python -m ruff check backend data scripts sdk/python examples/merchant_simulator
      - name: Type check
        run: python -m mypy backend
      - name: Apply migrations to empty PostgreSQL database
        run: python -m alembic upgrade head
      - name: Test
        run: python -m pytest
      - name: Synthetic evaluation smoke test
        run: PYTHONPATH=backend:. python scripts/evaluate_detector.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend
